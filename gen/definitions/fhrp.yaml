---
name: FHRP
path: /Cisco-IOS-XE-native:native/fhrp
doc_category: System
res_description: "This resource can manage the global FHRP configuration. VRRPv3 groups (`iosxe_interface_vrrp`) require `version_vrrp` set to `v3`. Destroying the resource removes the setting, which returns the device to its default of `v2`, and IOS-XE then deletes every VRRPv3 group on the device. Make the `iosxe_interface_vrrp` resources depend on this resource (`depends_on`), so that Terraform destroys them first."
no_delete: true
attributes:
  - yang_name: version/vrrp
    tf_name: version_vrrp
    description: Configure Virtual Router Redundancy Protocol version
    type: String
    enum_values:
      - v2
      - v3
    example: v3
