---
name: Interface VRRP
path: /Cisco-IOS-XE-native:native/interface/%s[name=%v]/Cisco-IOS-XE-vrrp:vrrp/vrrp-group[group-id=%v]
augment_path: /Cisco-IOS-XE-native:native/interface/GigabitEthernet[name=%v]/Cisco-IOS-XE-vrrp:vrrp/vrrp-group[group-id=%v]
doc_category: Interface
skip_minimum_test: true
no_delete_attributes: true
res_description: "This resource can manage a VRRPv3 group on an interface (`vrrp <group> address-family ipv4|ipv6`). Both address families of a group are managed by the same resource: setting `ipv4_primary_address` or `ipv6_primary_address` enables that family, removing it removes the family, and destroying the resource removes the group. At least one family must be configured, and `fhrp version vrrp v3` is required (see `iosxe_fhrp`)."
test_tags: [C8000V]
attributes:
  - yang_name: type
    tf_name: type
    description: Interface type
    type: String
    reference: true
    enum_values:
      - GigabitEthernet
      - TwoGigabitEthernet
      - FiveGigabitEthernet
      - TenGigabitEthernet
      - TwentyFiveGigE
      - FortyGigabitEthernet
      - FiftyGigabitEthernet
      - HundredGigE
      - Vlan
      - Port-channel
      - Port-channel-subinterface/Port-channel
      - BDI
    example: Vlan
  - yang_name: name
    example: 123
  - yang_name: group-id
    example: 1
  - yang_name: address-family/ipv4/address/primary/address
    xpath: address-family/ipv4/address/primary[primary='']/address
    delete_path: address-family/ipv4
    tf_name: ipv4_primary_address
    description: Virtual primary IPv4 address. Setting it enables the IPv4 address family for the group, and removing it removes the IPv4 address family
    type: String
    example: 192.0.2.254
  - yang_name: address-family/ipv4/address/secondary
    tf_name: ipv4_secondary_addresses
    type: List
    description: Secondary virtual IPv4 addresses
    attributes:
      - yang_name: address
        id: true
        type: String
        description: Secondary IPv4 address
        example: 192.0.2.253
      - yang_name: secondary
        type_yang_bool: empty
        default_value: true
        description: Mark address as secondary
        example: true
  - yang_name: address-family/ipv4/priority
    tf_name: ipv4_priority
    description: Priority level
    example: 110
  - yang_name: address-family/ipv4/preempt-new/preempt-choice/preempt-delay/preempt-delay/preempt/delay/minimum
    xpath: address-family/ipv4/preempt-new/preempt-delay/preempt/delay/minimum
    tf_name: ipv4_preempt_delay_minimum
    description: Seconds to delay before preempting
    example: 30
  - yang_name: address-family/ipv4/timers/advertise
    tf_name: ipv4_timers_advertise
    description: Advertisement interval in milliseconds
    example: 3000
  - yang_name: address-family/ipv4/description
    tf_name: ipv4_description
    type: String
    description: Group description
    example: VRRP-GROUP-1
  - yang_name: address-family/ipv4/track/event
    tf_name: ipv4_tracks
    type: List
    description: Object tracking configuration
    attributes:
      - yang_name: object-id
        id: true
        description: Specify the tracked object-id
        example: 1
      - yang_name: action/priority/decrement
        xpath: decrement
        tf_name: decrement
        description: Decrement value for tracked object
        example: 20
      - yang_name: action/other/shutdown
        xpath: shutdown
        tf_name: shutdown
        type_yang_bool: empty
        description: Shutdown group when tracked object goes down
        example: false
  - yang_name: address-family/ipv4/shutdown
    tf_name: ipv4_shutdown
    type_yang_bool: empty
    description: Shutdown the VRRP group
    example: false
  - yang_name: address-family/ipv6/address/primary/ipv6-link-local
    xpath: address-family/ipv6/address/primary[primary='']/ipv6-link-local
    delete_path: address-family/ipv6
    tf_name: ipv6_primary_address
    description: Virtual primary IPv6 link-local address. Setting it enables the IPv6 address family for the group, and removing it removes the IPv6 address family
    type: String
    normalize_ipv6: true
    example: fe80::1
  - yang_name: address-family/ipv6/address/ipv6-prefix
    tf_name: ipv6_prefixes
    type: List
    description: IPv6 prefix addresses
    attributes:
      - yang_name: prefix
        id: true
        type: String
        description: IPv6 prefix
        normalize_ipv6: true
        example: 2001:DB8::FFFF/64
  - yang_name: address-family/ipv6/priority
    tf_name: ipv6_priority
    description: Priority level
    example: 120
  - yang_name: address-family/ipv6/preempt-new/preempt-choice/preempt-delay/preempt-delay/preempt/delay/minimum
    xpath: address-family/ipv6/preempt-new/preempt-delay/preempt/delay/minimum
    tf_name: ipv6_preempt_delay_minimum
    description: Seconds to delay before preempting
    example: 30
  - yang_name: address-family/ipv6/timers/advertise
    tf_name: ipv6_timers_advertise
    description: Advertisement interval in milliseconds
    example: 3000
  - yang_name: address-family/ipv6/description
    tf_name: ipv6_description
    type: String
    description: Group description
    example: VRRP-GROUP-1-IPV6
  - yang_name: address-family/ipv6/track/event
    tf_name: ipv6_tracks
    type: List
    description: Object tracking configuration
    attributes:
      - yang_name: object-id
        id: true
        description: Specify the tracked object-id
        example: 1
      - yang_name: action/priority/decrement
        xpath: decrement
        tf_name: decrement
        description: Decrement value for tracked object
        example: 20
      - yang_name: action/other/shutdown
        xpath: shutdown
        tf_name: shutdown
        type_yang_bool: empty
        description: Shutdown group when tracked object goes down
        example: false
  - yang_name: address-family/ipv6/shutdown
    tf_name: ipv6_shutdown
    type_yang_bool: empty
    description: Shutdown the VRRP group
    example: false

test_prerequisites:
  - path: /Cisco-IOS-XE-native:native/fhrp/version
    attributes:
      - name: vrrp
        value: v3
  - path: /Cisco-IOS-XE-native:native/interface/Vlan[name=123]
    attributes:
      - name: name
        value: 123
  - path: /Cisco-IOS-XE-native:native/interface/Vlan[name=123]/ip/address/primary
    attributes:
      - name: address
        value: 192.0.2.1
      - name: mask
        value: 255.255.255.0
  - path: /Cisco-IOS-XE-native:native/interface/Vlan[name=123]/ipv6/address/link-local-address[address=fe80::1]
    attributes:
      - name: address
        value: fe80::1
      - name: link-local
        value: ""
