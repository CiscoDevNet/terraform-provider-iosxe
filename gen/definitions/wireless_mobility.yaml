---
name: Wireless Mobility
path: /Cisco-IOS-XE-wireless-mobility-cfg:mobility-cfg-data/mobility-config
no_delete: true
test_tags: [C9800]
doc_category: Wireless
res_description: "This resource can manage the Wireless Mobility configuration: the local mobility group name, the mobility MAC address, keepalive and DSCP settings, and the mobility group members (peers). The mobility configuration always exists on the controller, so destroying this resource only removes the configured attributes: the settings return to their defaults and the managed members are deleted. WARNING: changing `group_name` or `mac_address` on a live controller tears down its mobility tunnels. The controller refuses to change the `ip` or `public_ip` of an existing member; to re-address a member, remove it in one apply and add it again in the next."
attributes:
  - yang_name: local-group
    tf_name: group_name
    example: MOBILITY-1
  - yang_name: mac-address
    tf_name: mac_address
    description: Mobility local MAC address, in lowercase colon form (the controller stores it in lowercase).
    string_patterns:
      - '^[0-9a-f]{2}(:[0-9a-f]{2}){5}$'
    example: 00:00:00:00:0c:01
  - yang_name: mobility-keepalive-interval
    tf_name: group_keepalive_interval
    example: 20
  - yang_name: mobility-keepalive-count
    tf_name: group_keepalive_count
    example: 5
  - yang_name: mobility-dscp
    tf_name: dscp
    description: Mobility DSCP value
    example: 46
  - yang_name: mobility-peers/mobility-peer
    tf_name: group_members
    type: List
    attributes:
      - yang_name: mac-addr
        tf_name: mac_address
        id: true
        description: Mobility peer MAC address, in lowercase colon form (the controller stores it in lowercase).
        string_patterns:
          - '^[0-9a-f]{2}(:[0-9a-f]{2}){5}$'
        example: 00:00:00:00:0a:20
      - yang_name: ip-address
        tf_name: ip
        mandatory: true
        description: Peer IP address. The controller refuses to change it on an existing member.
        example: 192.0.2.20
      - yang_name: nat-ip
        tf_name: public_ip
        description: Peer public IP address. If omitted, a member configured through this resource is stored with public IP `0.0.0.0`, unlike the `wireless mobility group member` CLI, where it defaults to `ip`. Set it equal to `ip` to match the CLI behaviour. The controller refuses to change it on an existing member.
        example: 198.51.100.20
      - yang_name: group-name
        tf_name: group
        mandatory: true
        example: MOBILITY-2
      - yang_name: ssc-hash
        tf_name: ssc_hash
        description: Peer SSC hash. The controller requires exactly 40 characters and stores the value in the case given.
        string_min_length: 40
        string_max_length: 40
        example: 0123456789abcdef0123456789abcdef01234567
      - yang_name: data-link-encryption
        tf_name: data_link_encryption
        example: true
