---
name: Dial Peer Voice
path: /Cisco-IOS-XE-native:native/Cisco-IOS-XE-voice:dial-peer/voice[dialpeertag=%v]
doc_category: Voice
# CUBE is a router feature; a switch rejects these voice resources.
test_tags: [C8000V]
attributes:
  - yang_name: dialpeertag
    tf_name: tag
    id: true
    example: 100
  # `dial-peer voice <tag> <type>` requires the type at creation; mark mandatory
  # so the list entry is created with it rather than a bare (invalid) dial-peer.
  - yang_name: type
    mandatory: true
    example: voip
  - yang_name: description
    example: Outbound to CUCM
  - yang_name: destination-pattern
    exclude_test: true
    example: "+1408......."
  - yang_name: preference
    example: 1
  - yang_name: huntstop
    example: false
  - yang_name: shutdown
    example: false
  - yang_name: vad
    example: true
  - yang_name: srtp
    tf_name: srtp
    exclude_test: true
    example: true
  # --- Session ---
  - yang_name: session/protocol
    tf_name: session_protocol
    example: sipv2
  - yang_name: session/server-group
    tf_name: session_server_group
    example: 10
  - yang_name: session/target/target-choice/address-choice/address
    xpath: session/target/address
    tf_name: session_target
    exclude_test: true
    example: ipv4:10.0.0.1
  - yang_name: session/transport/transport-choice/tcp/tcp/tls
    xpath: session/transport/tcp/tls
    tf_name: session_transport_tcp_tls
    exclude_test: true
    example: true
  - yang_name: session/transport/transport-choice/tcp/tcp
    xpath: session/transport/tcp
    tf_name: session_transport_tcp
    exclude_test: true
    example: true
  - yang_name: session/transport/transport-choice/udp/udp
    xpath: session/transport/udp
    tf_name: session_transport_udp
    exclude_test: true
    example: true
  - yang_name: voice-class/sip/options-keepalive/keepalive-options/profile-config/profile-config
    xpath: voice-class/sip/options-keepalive/profile-config
    tf_name: voice_class_sip_options_keepalive_profile
    example: 100
  - yang_name: incoming/called-number
    tf_name: incoming_called_number
    exclude_test: true
    example: "+1.*"
  - yang_name: incoming/called/e164-pattern-map
    tf_name: incoming_called_e164_pattern_map
    exclude_test: true
    example: 2222
  - yang_name: incoming/uri/via
    tf_name: incoming_uri_via
    exclude_test: true
    example: "300"
  - yang_name: incoming/uri/request
    tf_name: incoming_uri_request
    exclude_test: true
    example: "300"
  # --- Destination routing ---
  - yang_name: destination/dpg
    tf_name: destination_dpg
    example: 100
  - yang_name: destination/e164-pattern-map
    tf_name: destination_e164_pattern_map
    exclude_test: true
    example: 1002
  - yang_name: destination/uri
    tf_name: destination_uri
    exclude_test: true
    example: "400"
  # --- Translation profiles ---
  - yang_name: translation-profile/incoming
    tf_name: translation_profile_incoming
    exclude_test: true
    example: PSTN-IN
  - yang_name: translation-profile/outgoing
    tf_name: translation_profile_outgoing
    exclude_test: true
    example: strip-pstn-prefix
  # --- voice-class sip ---
  - yang_name: voice-class/sip/tenant
    tf_name: voice_class_sip_tenant
    example: 100
  - yang_name: voice-class/sip/profiles/outbound-id/id
    tf_name: voice_class_sip_profiles
    example: 100
  - yang_name: voice-class/sip/profiles/sip-profiles-inbound/id
    tf_name: voice_class_sip_profiles_inbound
    exclude_test: true
    example: 100
  - yang_name: voice-class/sip/profiles/sip-profiles-inbound/inbound
    tf_name: voice_class_sip_profiles_inbound_enable
    exclude_test: true
    example: true
  - yang_name: voice-class/sip/bind/control/source-interface/source-interface-std/interface-choice/GigabitEthernet/GigabitEthernet
    xpath: voice-class/sip/bind/control/source-interface/source-interface-std/GigabitEthernet
    tf_name: voice_class_sip_bind_control_source_interface
    exclude_test: true
    example: "1"
  - yang_name: voice-class/sip/bind/media/source-interface/source-interface-std/interface-choice/GigabitEthernet/GigabitEthernet
    xpath: voice-class/sip/bind/media/source-interface/source-interface-std/GigabitEthernet
    tf_name: voice_class_sip_bind_media_source_interface
    exclude_test: true
    example: "1"
  - yang_name: voice-class/sip/bind/control/source-interface/source-interface-std/interface-choice/Loopback/Loopback
    xpath: voice-class/sip/bind/control/source-interface/source-interface-std/Loopback
    tf_name: voice_class_sip_bind_control_source_interface_loopback
    exclude_test: true
    example: 0
  - yang_name: voice-class/sip/bind/media/source-interface/source-interface-std/interface-choice/Loopback/Loopback
    xpath: voice-class/sip/bind/media/source-interface/source-interface-std/Loopback
    tf_name: voice_class_sip_bind_media_source_interface_loopback
    exclude_test: true
    example: 0
  - yang_name: voice-class/sip/bind/control/source-interface/source-interface-std/interface-choice/TenGigabitEthernet/TenGigabitEthernet
    xpath: voice-class/sip/bind/control/source-interface/source-interface-std/TenGigabitEthernet
    tf_name: voice_class_sip_bind_control_source_interface_ten_gigabit_ethernet
    exclude_test: true
    example: "0/0/0"
  - yang_name: voice-class/sip/bind/media/source-interface/source-interface-std/interface-choice/TenGigabitEthernet/TenGigabitEthernet
    xpath: voice-class/sip/bind/media/source-interface/source-interface-std/TenGigabitEthernet
    tf_name: voice_class_sip_bind_media_source_interface_ten_gigabit_ethernet
    exclude_test: true
    example: "0/0/0"
  - yang_name: voice-class/sip/bind/control/source-interface/source-interface-std/interface-choice/Port-channel/Port-channel
    xpath: voice-class/sip/bind/control/source-interface/source-interface-std/Port-channel
    tf_name: voice_class_sip_bind_control_source_interface_port_channel
    exclude_test: true
    example: 1
  - yang_name: voice-class/sip/bind/media/source-interface/source-interface-std/interface-choice/Port-channel/Port-channel
    xpath: voice-class/sip/bind/media/source-interface/source-interface-std/Port-channel
    tf_name: voice_class_sip_bind_media_source_interface_port_channel
    exclude_test: true
    example: 1
  - yang_name: voice-class/sip/early-offer/forced
    tf_name: voice_class_sip_early_offer_forced
    exclude_test: true
    example: true
  # --- voice-class codec / stun ---
  - yang_name: voice-class/codec/codectag
    tf_name: voice_class_codec
    exclude_test: true
    example: 1
  - yang_name: voice-class/codec/offer-all
    tf_name: voice_class_codec_offer_all
    exclude_test: true
    example: true
  - yang_name: voice-class/stun-usage
    tf_name: voice_class_stun_usage
    exclude_test: true
    example: 1
  # --- DTMF relay ---
  - yang_name: dtmf-relay/rtp-nte
    tf_name: dtmf_relay_rtp_nte
    exclude_test: true
    example: true
  - yang_name: dtmf-relay/sip-info
    tf_name: dtmf_relay_sip_info
    exclude_test: true
    example: true
  - yang_name: dtmf-relay/sip-kpml
    tf_name: dtmf_relay_sip_kpml
    exclude_test: true
    example: true
  - yang_name: dtmf-relay/sip-notify
    tf_name: dtmf_relay_sip_notify
    exclude_test: true
    example: true
  # --- IP QoS ---
  - yang_name: ip/qos/dscp-signaling/dscp
    tf_name: ip_qos_dscp_signaling
    exclude_test: true
    example: cs3
  - yang_name: ip/qos/dscp-signaling/signaling
    tf_name: ip_qos_dscp_signaling_enable
    exclude_test: true
    example: true
  # --- Call admission / answer / media / Class-of-Restriction ---
  - yang_name: max-conn/range
    tf_name: max_conn
    exclude_test: true
    example: 100
  - yang_name: max-conn/exempt-local-media
    tf_name: max_conn_exempt_local_media
    exclude_test: true
    example: true
  - yang_name: answer-address
    tf_name: answer_address
    exclude_test: true
    example: "+15551234567"
  - yang_name: codec/transparent
    tf_name: codec_transparent
    exclude_test: true
    example: true
  - yang_name: media-class
    tf_name: media_class
    exclude_test: true
    example: 1
  - yang_name: voice-class/media
    tf_name: voice_class_media
    exclude_test: true
    example: 1
  - yang_name: corlist/incoming
    tf_name: corlist_incoming
    exclude_test: true
    example: COR-IN
  - yang_name: corlist/outgoing
    tf_name: corlist_outgoing
    exclude_test: true
    example: COR-OUT
  # --- POTS / TDM gateway leaves (dial-peer voice ... pots) ---
  - yang_name: direct-inward-dial
    tf_name: direct_inward_dial
    exclude_test: true
    example: true
  - yang_name: forward-digits/fwd-digit-choice/all/all
    xpath: forward-digits/all
    tf_name: forward_digits_all
    exclude_test: true
    example: true
  - yang_name: forward-digits/fwd-digit-choice/num-digits/num-digits
    xpath: forward-digits/num-digits
    tf_name: forward_digits_num
    exclude_test: true
    example: 4
  - yang_name: port
    tf_name: port
    exclude_test: true
    example: "0/1/0:23"
  - yang_name: prefix
    tf_name: prefix
    exclude_test: true
    example: "9"
  - yang_name: trunkgroup
    tf_name: trunk_groups
    type: List
    exclude_test: true
    attributes:
      - yang_name: id
        tf_name: name
        id: true
        example: PRI-1
      - yang_name: trunk-group-preference
        tf_name: preference
        example: 1

# Minimal prerequisite objects for the cross-references the test exercises
# (dpg, server-group, sip-options-keepalive, tenant, sip-profiles). The codec,
# e164-pattern-map, uri and translation-profile references stay excluded - their
# prerequisite objects need nested content a flat `iosxe_yang` prereq can't set.
test_prerequisites:
  # Data plane: an SBC (voip) dial-peer with server-group/tenant/dpg references
  # needs `voice service voip / allow connections sip to sip` active first.
  - path: /Cisco-IOS-XE-native:native/Cisco-IOS-XE-voice:voice/service[type=voip]
    no_delete: true
    attributes:
      - name: type
        value: voip
      - name: allow-connections/sip/to/sip
        value: ""
  - path: /Cisco-IOS-XE-native:native/Cisco-IOS-XE-voice:voice/class/dpg[id=100]
    attributes:
      - name: id
        value: 100
  - path: /Cisco-IOS-XE-native:native/Cisco-IOS-XE-voice:voice/class/server-group[id=10]
    attributes:
      - name: id
        value: 10
  - path: /Cisco-IOS-XE-native:native/Cisco-IOS-XE-voice:voice/class/sip-options-keepalive[id=100]
    attributes:
      - name: id
        value: 100
  - path: /Cisco-IOS-XE-native:native/Cisco-IOS-XE-voice:voice/class/tenant[id=100]
    attributes:
      - name: id
        value: 100
  - path: /Cisco-IOS-XE-native:native/Cisco-IOS-XE-voice:voice/class/sip-profiles[id=100]
    attributes:
      - name: id
        value: 100
