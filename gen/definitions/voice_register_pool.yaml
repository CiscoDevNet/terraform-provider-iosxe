---
name: Voice Register Pool
path: /Cisco-IOS-XE-native:native/Cisco-IOS-XE-voice:voice/register/pool[pool-tag=%v]
doc_category: Voice
# CUBE/SRST is a router feature; a switch rejects voice register config.
test_tags: [C8000V]
# A pool has a YANG `when "../global and ../global/max-pool"`, so
# `voice register global` with `max-pool` must exist before any pool.
test_prerequisites:
  - path: /Cisco-IOS-XE-native:native/Cisco-IOS-XE-voice:voice/register/global
    attributes:
      - name: max-pool
        value: 10
attributes:
  - yang_name: pool-tag
    tf_name: tag
    id: true
    example: 1
  # --- Device / phone identity (network match) ---
  - yang_name: id/network/ipaddress/ipv4/ipv4address/address
    xpath: id/network/ipv4address/address
    tf_name: id_network_address
    example: 192.0.2.0
  - yang_name: id/network/ipaddress/ipv4/ipv4address/mask
    xpath: id/network/ipv4address/mask
    tf_name: id_network_mask
    example: 255.255.255.0
  # --- Call forward (B2BUA) ---
  - yang_name: call-forward/b2bua/all
    tf_name: call_forward_b2bua_all
    example: "1001"
  - yang_name: call-forward/b2bua/busy
    tf_name: call_forward_b2bua_busy
    example: "1001"
  - yang_name: call-forward/b2bua/mailbox
    tf_name: call_forward_b2bua_mailbox
    example: "1001"
  - yang_name: call-forward/b2bua/noan-config/noan
    tf_name: call_forward_b2bua_noan
    example: "1001"
  - yang_name: call-forward/b2bua/noan-config/timeout
    tf_name: call_forward_b2bua_noan_timeout
    example: 20
  # --- Voice class references ---
  # codec is a leafref to `voice class codec` (iosxe_voice_class_codec, added in
  # a separate change); excluded here so this resource's test is self-contained.
  - yang_name: voice-class/codec
    tf_name: voice_class_codec
    exclude_test: true
    example: 1
  - yang_name: voice-class/srtp-crypto
    tf_name: voice_class_srtp_crypto
    exclude_test: true
    example: 1
  # --- DTMF relay ---
  - yang_name: dtmf-relay/rtp-nte
    tf_name: dtmf_relay_rtp_nte
    example: true
  - yang_name: dtmf-relay/sip-kpml
    tf_name: dtmf_relay_sip_kpml
    example: true
  - yang_name: dtmf-relay/sip-notify
    tf_name: dtmf_relay_sip_notify
    example: true
  # --- Class of Restriction (references dial-peer cor lists) ---
  # `name` is a leafref to a `dial-peer cor list`; full testing needs that list
  # as a prerequisite, so the cor lists stay excluded from this resource's test.
  # lowerbound/hyphen/upperbound express a number range (`when id != 'default'`).
  - yang_name: cor/incoming
    tf_name: cor_incoming
    type: List
    exclude_test: true
    attributes:
      - yang_name: id
        id: true
        example: default
      - yang_name: name
        example: WxC-DefaultPermissions
      - yang_name: lowerbound
        example: "1000"
      - yang_name: hyphen
        example: "-"
      - yang_name: upperbound
        example: "1999"
  - yang_name: cor/outgoing
    tf_name: cor_outgoing
    type: List
    exclude_test: true
    attributes:
      - yang_name: id
        id: true
        example: default
      - yang_name: name
        example: WxC-DefaultPermissions
      - yang_name: lowerbound
        example: "1000"
      - yang_name: hyphen
        example: "-"
      - yang_name: upperbound
        example: "1999"
  # --- Translation profiles ---
  - yang_name: translation-profile/incoming
    tf_name: translation_profile_incoming
    exclude_test: true
    example: PSTN-IN
  - yang_name: translation-profile/outgoing
    tf_name: translation_profile_outgoing
    exclude_test: true
    example: PSTN-OUT
