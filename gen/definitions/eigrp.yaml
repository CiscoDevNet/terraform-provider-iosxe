---
name: EIGRP
path: /Cisco-IOS-XE-native:native/router/Cisco-IOS-XE-eigrp:router-eigrp/eigrp/named-mode[name=%s]/address-family/ipv4/af-ipv4[unicast=unicast]
doc_category: EIGRP
res_description: "This resource can manage the EIGRP configuration. Destroying it removes the IPv4 unicast address family, but the `router eigrp <name>` instance stays on the device, because VRF address families (`iosxe_eigrp_vrf`) can share it."
test_prerequisites:
  # Creating the address family implicitly creates `router eigrp TOPGEN`, and
  # destroying it leaves the empty instance behind, so the test owns the
  # instance and removes it afterwards.
  - path: /Cisco-IOS-XE-native:native/router/Cisco-IOS-XE-eigrp:router-eigrp/eigrp/named-mode[name=TOPGEN]
    attributes:
      - name: name
        value: TOPGEN
attributes:
  - yang_name: name
    xpath: ../../../name
    tf_name: name
    id: true
    reference: true
    example: TOPGEN
    description: EIGRP virtual-instance name
  - yang_name: autonomous-system
    no_delete: true
    example: 100
    description: Autonomous system number
  - yang_name: eigrp/router-id
    tf_name: router_id
    example: 10.255.0.1
    description: Router ID for this EIGRP process
  - yang_name: network/address-wildcard
    tf_name: networks
    type: List
    description: Enable routing on an IP network
    attributes:
      - yang_name: ipv4-address
        tf_name: ip
        id: true
        example: 10.10.0.0
        description: Network number
      - yang_name: wildcard
        id: true
        example: 0.0.255.255
        description: EIGRP wild card bits
  - yang_name: topology/topo-base/topology-base
    tf_name: topology_base
    default_value: "base"
    no_delete: true
    exclude_test: true
    description: Base topology (always base)
  - yang_name: topology/topo-base/auto-summary
    tf_name: auto_summary
    default_value: "false"
    no_delete: true
    example: false
    description: Enable automatic network number summarization
  - yang_name: af-interface
    tf_name: af_interfaces
    type: List
    description: Enter Address Family interface configuration
    attributes:
      - yang_name: interface
        id: true
        example: default
        description: Interface name or default for the default AF interface
      - yang_name: passive-interface
        default_value: "false"
        example: true
        description: Suppress address updates on an interface
      - yang_name: split-horizon
        default_value: "true"
        example: false
        description: Perform split horizon
  - yang_name: eigrp/stub/stub-type-choice/advertise/advertise/connected
    xpath: eigrp/stub/advertise/connected
    tf_name: stub_connected
    example: true
    description: Enable EIGRP stub routing and advertise connected routes (`eigrp stub connected`)
  - yang_name: eigrp/stub/stub-type-choice/advertise/advertise/summary
    xpath: eigrp/stub/advertise/summary
    tf_name: stub_summary
    example: true
    description: Enable EIGRP stub routing and advertise summary routes (`eigrp stub summary`)
  - yang_name: shutdown
    example: false
    description: Shutdown address family
