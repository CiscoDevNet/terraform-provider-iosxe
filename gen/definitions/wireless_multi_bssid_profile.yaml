  - yang_name: he-mumimo-downlink
    tf_name: dot11ax_downlink_mumimo
    example: false
  - yang_name: he-mumimo-uplink
    tf_name: dot11ax_uplink_mumimo
    example: false
  - yang_name: he-twt
